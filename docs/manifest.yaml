# The publication allowlist for this corpus.
#
# Nothing under docs/ is published without an entry here, and every entry must name a file
# git actually tracks — both directions are checked, because an entry naming an untracked
# file passes locally while the pushed commit does not contain it.
#
# `when_changing` is phrased as the TASK an agent is about to do, not the subsystem name:
# an agent knows what it is about to change before it knows which subsystem owns it, and the
# generated routing table has to meet it there.
#
# Verify with:  python -m scripts.verify_docs .
# Regenerate:   python -m scripts.verify_docs . --write-nav

- doc: manifest.yaml
  kind: meta
  summary: The publication allowlist for this corpus.

- doc: README.md
  kind: index
  summary: Routing map — what you are about to change, and what to read for it.

- doc: llms.txt
  kind: generated
  summary: Flat index of the corpus, generated from this manifest.

- doc: doctrine/invariants.md
  kind: generated
  summary: Every INV-* id, its statement, and the file that defines it.

- doc: doctrine/publishing.md
  summary: The one rule that decides whether a fact may be written down in this repository.
  when_changing: anything published — docs, comments, commit messages, PR text, branch names
  covers:
    - .githooks/pre-commit
    - .githooks/deny-patterns.txt
    - scripts/deny-sweep.sh
    - scripts/gate.sh
    - scripts/attest.sh
    - .githooks/pre-push
  tests:
    - tests/test_deny_sweep.py
    - tests/test_leak_guard.py
    - tests/test_gate_hook.py
  related: [contributing/doc-contract.md]
  defines_invariants: [INV-PUB-001, INV-PUB-002, INV-PUB-003]

- doc: architecture/overview.md
  summary: What Casa is made of — supervised services, the three agent tiers, and where configuration enters.
  when_changing: anything structural, or when you need to find which document owns an area
  covers:
    - casa/rootfs/opt/casa/casa_core.py::main
    - casa/rootfs/opt/casa/runtime.py::CasaRuntime
    - casa/config.yaml::options
  tests:
    - tests/test_casa_core_agent_loading.py
    - tests/test_setup_nginx_ingress.py
  related: [architecture/agent-taxonomy.md, architecture/turn-loop.md]
  defines_invariants: [INV-SYS-001, INV-SYS-002]

- doc: architecture/agent-taxonomy.md
  summary: How an agent is declared, validated and looked up — tiers, required artifacts, and the registry.
  when_changing: adding an agent or a tier, the required file set, or role resolution
  covers:
    - casa/rootfs/opt/casa/agent_registry.py::AgentRegistry
    - casa/rootfs/opt/casa/agent_registry.py::KnownAgent
    - casa/rootfs/opt/casa/agent_registry.py::AgentRegistry.tier_for_role
    - casa/rootfs/opt/casa/agent_loader.py::validate_config_repo
    - casa/rootfs/opt/casa/agent_loader.py::LoadError
    - casa/rootfs/opt/casa/agent_loader.py::_check_file_set
    - casa/rootfs/opt/casa/casa_core.py::_build_role_registry
  tests:
    - tests/test_agent_registry.py::test_role_to_name_basic
    - tests/test_agent_registry.py::test_name_to_role_unknown_returns_none
    - tests/test_agent_loader.py::test_duplicate_role_across_residents_and_specialists_fails
  related: [architecture/overview.md, architecture/turn-loop.md]
  defines_invariants: [INV-AGENT-001, INV-AGENT-002, INV-AGENT-003, INV-AGENT-004]

- doc: architecture/http-surface.md
  summary: The two HTTP servers, what each exposes, and how an inbound request is authenticated.
  when_changing: adding a route, changing webhook authentication, or anything crossing the container boundary
  covers:
    - casa/rootfs/opt/casa/webhook_auth.py::verify
    - casa/rootfs/opt/casa/webhook_auth.py::read_secret
    - casa/rootfs/opt/casa/casa_core.py::healthz
    - casa/rootfs/opt/casa/ingress_identity.py::validate_ingress_identity_table
    - casa/rootfs/opt/casa/ingress_identity.py::ingress_identity
    - casa/rootfs/opt/casa/provenance.py::sanitize_external_context
    - casa/rootfs/etc/s6-overlay/scripts/setup-nginx.sh
    - casa/config.yaml::ports
  tests:
    - tests/test_webhook_auth.py::test_hmac_body_valid
    - tests/test_webhook_auth.py::test_hmac_body_wrong_secret_fails
    - tests/test_webhook_auth.py::test_hmac_body_missing_header_fails
    - tests/test_webhook_origin_containment.py
    - tests/test_setup_nginx_ingress.py
  related: [architecture/overview.md]
  defines_invariants: [INV-HTTP-001, INV-HTTP-002, INV-HTTP-003, INV-HTTP-004, INV-HTTP-005]

- doc: architecture/memory.md
  summary: Long-term memory — how a fact is written, who may read it back, and what a caller is told when the store cannot answer.
  when_changing: recall behaviour, sensitivity tiers, provenance on a stored fact, or session persistence
  covers:
    - casa/rootfs/opt/casa/semantic_memory.py::SemanticMemory
    - casa/rootfs/opt/casa/semantic_memory.py::RecallUnavailable
    - casa/rootfs/opt/casa/semantic_memory.py::RecallProtocolError
    - casa/rootfs/opt/casa/semantic_memory.py::NoOpSemanticMemory
    - casa/rootfs/opt/casa/hindsight_memory.py::HindsightSemanticMemory.recall_items
    - casa/rootfs/opt/casa/sensitivity.py::clearance_for_channel
    - casa/rootfs/opt/casa/sensitivity.py::clearance_for_origin
    - casa/rootfs/opt/casa/channel_policy.py::writes_to_bank
    - casa/rootfs/opt/casa/memory_provenance.py::build_retain_items
    - casa/rootfs/opt/casa/recall_renderer.py::render_recall
    - casa/rootfs/opt/casa/recall_health.py::observed_recall
    - casa/rootfs/opt/casa/session_saver.py::save_session
  tests:
    - tests/test_recall_absence_invariant.py
    - tests/test_recall_health.py::test_breaker_opens_after_threshold_failures
    - tests/test_sensitivity.py::test_readable_tiers_is_clearance_and_below
    - tests/test_channel_policy.py
    - tests/test_memory_provenance.py
    - tests/test_agent_auto_recall_unavailable.py
  related: [architecture/overview.md, architecture/turn-loop.md]
  defines_invariants: [INV-MEM-001, INV-MEM-002, INV-MEM-003, INV-MEM-004, INV-MEM-005]

- doc: architecture/plugins.md
  summary: How a plugin becomes usable — registry, content-addressed store, artifact identity, and per-call authorization.
  when_changing: plugin installation, artifact identity, protected tools, or authorization grants
  covers:
    - casa/rootfs/opt/casa/plugin_registry.py::compute_artifact_id
    - casa/rootfs/opt/casa/plugin_registry.py::reload_snapshot
    - casa/rootfs/opt/casa/plugin_store.py::safe_extract_tar
    - casa/rootfs/opt/casa/plugin_store.py::artifact_verdict
    - casa/rootfs/opt/casa/plugin_store.py::manifest_protected_tools
    - casa/rootfs/opt/casa/plugin_grants.py::protected_map
    - casa/rootfs/opt/casa/authz_grants.py::GrantKey
    - casa/rootfs/opt/casa/authz_grants.py::GrantStore
    - casa/rootfs/opt/casa/plugin_boot.py::main
  tests:
    - tests/test_plugin_registry.py
    - tests/test_plugin_store_publish.py
    - tests/test_plugin_grants.py
    - tests/test_authz_grants.py
    - tests/test_authz_hook.py
    - tests/test_plugin_boot.py
  related: [architecture/overview.md, architecture/agent-taxonomy.md]
  defines_invariants: [INV-PLUG-001, INV-PLUG-002, INV-PLUG-003, INV-PLUG-004, INV-PLUG-005, INV-PLUG-006]

- doc: architecture/turn-loop.md
  summary: How one inbound message becomes one agent turn, and what bounds it.
  when_changing: the turn lifecycle, the warm client pool, retry behaviour, or turn teardown
  covers:
    - casa/rootfs/opt/casa/agent.py::Agent._process
    - casa/rootfs/opt/casa/agent.py::Agent._build_options
    - casa/rootfs/opt/casa/agent.py::Agent.aclose
    - casa/rootfs/opt/casa/sdk_client_pool.py::SdkClientPool.turn
    - casa/rootfs/opt/casa/sdk_client_pool.py::ManagedSdkClient
    - casa/rootfs/opt/casa/sdk_client_pool.py::PoolUnavailable
    - casa/rootfs/opt/casa/retry.py::retry_sdk_call
    - casa/rootfs/opt/casa/retry.py::compute_backoff_ms
  tests:
    - tests/test_agent_process.py::test_session_id_is_channel_plus_role
    - tests/test_agent_process.py::test_telegram_channel_autorecalls_on_fresh_session
    - tests/test_sdk_client_pool_pool.py
    - tests/test_retry.py
  related: [architecture/overview.md, architecture/agent-taxonomy.md]
  defines_invariants: [INV-TURN-001, INV-TURN-002, INV-TURN-003, INV-TURN-004, INV-TURN-005]

- doc: contributing/doc-contract.md
  summary: The shape a document takes, and which of its rules CI enforces versus a reviewer.
  when_changing: the documentation rules themselves, or adding a document to the corpus
  covers:
    - scripts/verify_docs.py::verify
    - scripts/verify_docs.py::_check_sourcemap
    - scripts/verify_docs.py::_check_invariants
    - scripts/verify_docs.py::write_nav
  tests:
    - tests/test_verify_docs.py
  related: [doctrine/publishing.md]
  defines_invariants: [INV-DOC-001, INV-DOC-002, INV-DOC-003, INV-DOC-004, INV-DOC-005, INV-DOC-006]
