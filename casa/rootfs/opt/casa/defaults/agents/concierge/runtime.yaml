schema_version: 1
kind: resident
model:
  source: ha_option
  option: voice_agent_model
  default: haiku
  allowed: [opus, sonnet, haiku]
enabled: true
tools:
  allowed:
    - WebSearch
    - mcp__casa-framework__delegate_to_agent
    # #419 — a headless event wake cannot ask for approval; without this
    # every nudge would stall to budget exhaustion since ack_event could
    # never actually run (any resident role may be an operator-assigned
    # event-delivery target).
    - mcp__casa-framework__ack_event
  disallowed:
    # #396: session-scoped schedulers. These outlive nothing — CronCreate
    # reports "Session-only (not written to disk, dies when Claude exits)" —
    # so a reminder set through one is silently discarded at the next
    # restart, after the user has been told it is set. Note that tools.allowed
    # is an AUTO-APPROVE list, not a deny list, which is how these were
    # reachable without ever being listed. Use set_reminder instead.
    - CronCreate
    - CronDelete
    - CronList
    - ToolSearch
    # The built-in `schedule` skill creates cloud routines against a claude.ai
    # account a Casa install has no connection to; it fails at call time.
    - Skill(schedule)
    - Bash
    - Write
    - Edit
    - Read
    - Glob
    - Grep
    - WebFetch
    - NotebookEdit
    - Agent
    - Task
  permission_mode: dontAsk
  max_turns: 6
mcp_server_names:
  - casa-framework
memory:
  token_budget: 0
  read_strategy: cached
channels:
  - ha_voice
session:
  strategy: pooled
  idle_timeout: 300
tts:
  tag_dialect: square_brackets
voice_errors:
  timeout:       "[apologetic] That took too long — ask me again?"
  rate_limit:    "[flat] Give me a minute, I'm swamped."
  sdk_error:     "[apologetic] I couldn't reach my brain. Try again?"
  memory_error:  ""
  channel_error: "[flat] Something went wrong sending that."
  unknown:       "[flat] Sorry, something went wrong."
cwd: ""
