name: Docs

# The corpus in docs/ is published, so these checks run on every pull request and on main.
#
# CI is DEFENCE IN DEPTH, not the control. `main` has no branch protection and merges use
# --admin, so CI is not guaranteed to run before a merge; the mandatory control is the local
# pre-push gate (scripts/gate.sh plus the attestation it requires). What CI adds is a second
# pair of eyes on every PR, and a check that runs in a clone nobody has configured.
#
# CI deliberately has NO private supplement: the exact-literal layer lives with the operator
# and is applied by the hook and the gate. CI runs the generic patterns and the scanner.
#
# READ THIS BEFORE TRUSTING A GREEN RESULT. Every script and policy file this job runs comes
# from the pull request's own checkout, so a PR can weaken its own guard — replace a scanner
# with a no-op, relax the deny patterns, delete a step. `pull_request` is still the right
# event (it keeps secrets and a write token away from PR-controlled code), and this is an
# accepted property rather than a defect, because the mandatory control is the local gate.
# The consequence is concrete: a PR touching .github/workflows/, scripts/, .githooks/ or
# tests/ needs privileged human review, and its green check proves nothing on its own.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-verify:
    name: Corpus + publication guard
    runs-on: ubuntu-latest
    env:
      CASA_ALLOW_NO_SUPPLEMENT: "1" # CI has no private supplement, by design
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the range sweeps need history, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Verify manifest, anchors, budget and invariants
        run: |
          python -m scripts.verify_docs .
          python3 scripts/coverage_ledger.py check .

      - name: Docs-impact acknowledgement logic
        # The waiver parser is the one part of this workflow that can let drift
        # through, and it only executes on pull requests — so it would otherwise
        # be unexercised until the PR that depends on it. The harness lifts the
        # decision block out of THIS file and drives it over synthetic ranges.
        run: bash tests/test_docs_impact_ack.sh

      - name: Generated navigation is current
        run: python -m scripts.verify_docs . --check-nav

      - name: Size report (growth pressure, informational)
        run: python -m scripts.verify_docs . --report

      - name: Operating cards point at the doctrine
        run: |
          set -euo pipefail
          # Cards are prose and wrap at ~95 columns, so both required phrases can
          # legitimately span a line break — normalise newlines before matching.
          for card in CLAUDE.md AGENTS.md; do
            flat="$(tr '\n' ' ' < "$card" | tr -s ' ')"
            printf '%s' "$flat" | grep -q 'verifiable from the public commit alone' || {
              echo "::error::$card no longer states the publication rule"; exit 1; }
            printf '%s' "$flat" | grep -Eq "docs/README\.md.{0,20}routing table" || {
              echo "::error::$card no longer routes agents into the docs corpus (needs the docs/README.md routing-table directive)"; exit 1; }
          done

      - name: Deny sweep — tracked tree
        run: scripts/deny-sweep.sh tree

      - name: Deny sweep — the commits this PR would publish
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          # merge-base..HEAD, not base...HEAD: `git rev-list A...B` is the SYMMETRIC
          # difference, so it would sweep commits that are on the base and not in this PR.
          # Three dots is right for `git diff`, wrong for enumerating what this PR adds.
          range="$(git merge-base "$base" HEAD)..HEAD"
          scripts/deny-sweep.sh range "$range"
          scripts/deny-sweep.sh messages "$range"

      - name: Secret scan
        run: |
          set -euo pipefail
          # The runner cannot write to root-owned /usr/local/bin.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          scripts/run-gitleaks.sh tree
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            scripts/run-gitleaks.sh range "$(git merge-base "$base" HEAD)..HEAD"
          fi

      - name: Docs impact on claimed surfaces
        if: github.event_name == 'pull_request'
        env:
          # Sol r2: on `pull_request`, actions/checkout leaves HEAD at GitHub's
          # SYNTHETIC MERGE COMMIT, whose message is "Merge <sha> into <sha>" —
          # reading waivers from HEAD would miss every real one and fail the
          # gate noisily on legitimate pull requests. Name the contributor's tip
          # explicitly. Also lets the offline harness point this at a commit of
          # its own and prove the merge-ref case.
          ACK_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"

          # A version-only bump to the app manifest is not a schema change. BOTH added and
          # removed lines are inspected: deleting an option produces no added schema line,
          # and treating that as version-only would skip the check on an option removal —
          # the change most likely to invalidate a document.
          if printf '%s\n' "$changed" | grep -qx 'casa/config\.yaml'; then
            substantive="$(git diff -U0 "$base"...HEAD -- casa/config.yaml \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '^[+-]version:' || true)"
            if [ -z "$substantive" ]; then
              changed="$(printf '%s\n' "$changed" | grep -vx 'casa/config\.yaml' || true)"
            fi
          fi

          # The claim map is editable in the same PR, so consult the BASE manifest too:
          # deleting a covers anchor must not delete the obligation.
          #
          # FAIL CLOSED. Substituting an empty manifest on any error silently drops every
          # base-side claim — the exact obligations this step exists to preserve. An empty
          # one is accepted only when the base genuinely has no manifest, which is true
          # until the corpus first lands and false forever after.
          if git cat-file -e "$base:docs/manifest.yaml" 2>/dev/null; then
            git show "$base:docs/manifest.yaml" > "$RUNNER_TEMP/base-manifest.yaml"
            # #367: base-side claims live in manifest shards too. Each shard is a
            # top-level YAML list, so plain concatenation yields one valid list.
            # `grep || true`: a base with no shards (grep exit 1) must not kill
            # the job under pipefail — that is every PR until shards first land.
            git ls-tree --name-only "$base" -- docs/manifest.d/ 2>/dev/null \
              | { grep '\.yaml$' || true; } | while read -r shard; do
                git show "$base:$shard" >> "$RUNNER_TEMP/base-manifest.yaml"
              done
          else
            echo "note: $base has no docs/manifest.yaml yet — no base-side claims to carry"
            : > "$RUNNER_TEMP/base-manifest.yaml"
          fi
          impacted="$(printf '%s\n' "$changed" \
            | python -m scripts.verify_docs . --impact --base-manifest "$RUNNER_TEMP/base-manifest.yaml")"
          [ -n "$impacted" ] || exit 0

          # A DELETED doc is not an updated doc.
          touched="$(git diff --name-only --diff-filter=d "$base"...HEAD | grep '^docs/' | sed 's|^docs/||' || true)"
          deleted="$(git diff --name-only --diff-filter=D "$base"...HEAD | grep '^docs/' | sed 's|^docs/||' || true)"
          # One path per line, never `for doc in $impacted`: word splitting would break a
          # path containing a space into fragments, and matching those fragments against
          # `touched` could satisfy the check while the real claiming document is untouched.
          # The verifier separately forbids whitespace in manifest paths; this does not rely
          # on that holding.
          : > "$RUNNER_TEMP/missing.txt"
          # A claimed surface can genuinely change without invalidating the prose — the
          # claim is file-level, so editing one function in a file whose OTHER symbol the
          # document quotes impacts nothing readers can see. Requiring a doc edit anyway
          # would buy cosmetic commits and teach everyone to make them, which is how a
          # gate stops meaning anything. So there is an explicit, per-document, reasoned
          # acknowledgement — recorded in a commit message, therefore in history:
          #
          #     Docs-impact: architecture/tools-interface.md — none (claimed symbols unchanged)
          #
          # Per-document ON PURPOSE: one blanket waiver would let a six-document PR
          # through on a single line, and looking at each document is the whole point.
          # A reason is mandatory; the separator may be an em dash or a plain hyphen.
          #
          # ACCEPTED RESIDUAL (both reviewers, rounds 1-2, deliberately not chased):
          # this gate cannot verify that a waiver is SINCERE. `--amend --no-edit`
          # after further edits, `git commit -C <old>`, or a reason of "abc" all
          # satisfy the letter. No text check can do better — a determined author can
          # equally write a false reason — so the mechanism is aimed at the failure
          # that actually happened here: a batch merged before anyone looked, with the
          # drift unnoticed. What it guarantees is narrow and worth having: nobody
          # merges without naming each impacted document and writing a sentence about
          # it, and that sentence is in the history under their name. Substance is a
          # review question, not a CI one. Do not add a diff-digest binding scheme
          # without evidence of a real case it would have caught.
          # Acknowledgements are read from the TIP COMMIT ONLY, as a trailer at column
          # zero. This mirrors scripts/attest.sh, whose receipts a new commit voids on
          # purpose: an acknowledgement is a statement about the diff as it finally
          # stands, so pushing another commit must invalidate it rather than let a line
          # written five commits ago — possibly since reverted, cherry-picked, or merged
          # in from elsewhere — waive a surface it never saw. Requiring column zero also
          # stops an indented EXAMPLE inside prose (a commit that documents this very
          # mechanism, say) from acting as a live waiver.
          : > "$RUNNER_TEMP/acked.txt"
          if [ -z "${ACK_COMMIT:-}" ]; then
            echo "::error::ACK_COMMIT is empty — cannot identify the tip commit."
            exit 1
          fi
          git log -1 --format=%B "$ACK_COMMIT" \
            | sed -n 's/^[Dd]ocs-[Ii]mpact:[[:space:]]*//p' \
            > "$RUNNER_TEMP/acks.txt"
          # Read from a FILE, never a pipe: a `while` on the right of a pipe runs in a
          # subshell, where `exit 1` would end the subshell and let the step continue.
          while IFS= read -r ack; do
            [ -n "$ack" ] || continue
            ack_doc="${ack%%[[:space:]]*}"
            ack_rest="$(printf '%s' "${ack#"$ack_doc"}" | sed 's/^[[:space:]]*//')"
            # A separator is required, so `Docs-impact: <doc> <doc>` cannot pass by
            # looking like a reason.
            case "$ack_rest" in
              "—"*|"--"*|"-"*) ;;
              *)
                echo "::error::Docs-impact for '$ack_doc' needs '— <reason>'."
                exit 1 ;;
            esac
            ack_reason="$(printf '%s' "$ack_rest" | sed 's/^\(—\|--\|-\)[[:space:]]*//')"
            # A REAL reason: at least three alphanumerics, so punctuation, a second
            # separator, or a lone character cannot stand in for having thought about
            # it; and not merely the document's own name echoed back.
            ack_core="$(printf '%s' "$ack_reason" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')"
            ack_docname="$(printf '%s' "$ack_doc" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')"
            if [ "${#ack_core}" -lt 3 ] || [ "$ack_core" = "$ack_docname" ]; then
              echo "::error::Docs-impact for '$ack_doc' has no real reason: '$ack_reason'"
              echo "::error::Say why the prose is still true, in words."
              exit 1
            fi
            printf '%s\n' "$ack_doc" >> "$RUNNER_TEMP/acked.txt"
            echo "note: docs-impact acknowledged for $ack_doc — $ack_reason"
          done < "$RUNNER_TEMP/acks.txt"
          while IFS= read -r doc; do
            [ -n "$doc" ] || continue
            if printf '%s\n' "$deleted" | grep -qxF -- "$doc"; then
              echo "::error::$doc claimed a changed surface and was deleted in the same PR."
              echo "::error::Retire a claimed document in its own PR, not alongside the change."
              exit 1
            fi
            printf '%s\n' "$touched" | grep -qxF -- "$doc" && continue
            grep -qxF -- "$doc" "$RUNNER_TEMP/acked.txt" 2>/dev/null && continue
            printf '%s\n' "$doc" >> "$RUNNER_TEMP/missing.txt"
          done <<< "$impacted"
          if [ -s "$RUNNER_TEMP/missing.txt" ]; then
            echo "::error::changed a claimed surface; these docs claim it but did not change:"
            sed 's/^/::error::  /' "$RUNNER_TEMP/missing.txt"
            echo "::error::Update each document, or acknowledge it in a commit message:"
            echo "::error::  Docs-impact: <doc> — <why the prose is still true>"
            exit 1
          fi
